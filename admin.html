<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Admin Dashboard - PikaShot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="admin.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, getDocs, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKu623PDECcc1gYVe4xof6AVUxDlW7B_A",
            authDomain: "pika-shot.firebaseapp.com",
            projectId: "pika-shot",
            storageBucket: "pika-shot.firebasestorage.app",
            messagingSenderId: "221719282655",
            appId: "1:221719282655:web:fefc576166eeb115077a6a"
        };

        // A named app keeps the admin sign-in separate from the anonymous session the main app
        // creates for every visitor on this same site; otherwise that session skips the login.
        const app = initializeApp(firebaseConfig, 'admin');
        window.fb = {
            auth: getAuth(app),
            db: getFirestore(app),
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            collection,
            doc,
            getDoc,
            setDoc,
            getDocs,
            query,
            where,
            Timestamp
        };
    </script>
</head>
<body>

    <div id="login-modal" class="modal-overlay">
        <form id="login-form" class="login-card">
            <span class="logo logo-lg">P</span>
            <h2>Admin sign in</h2>
            <p class="login-sub">See how PikaShot is being used.</p>
            <input type="email" id="email-input" placeholder="Email" autocomplete="username" required>
            <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
            <p id="error-message" class="error" role="alert"></p>
        </form>
    </div>

    <div id="dashboard-container" class="shell" style="display: none;">

        <aside class="rail" aria-label="Main">
            <div class="brand">
                <span class="logo">P</span>
                <span class="brand-name">PikaShot</span>
                <span class="brand-tag">Admin</span>
            </div>
            <nav class="nav" id="rail-nav" aria-label="Sections"></nav>
            <div class="rail-foot">
                <button type="button" class="since" data-act="since" title="Choose the date to count from">
                    <span class="since-ico" data-icon="calendar"></span>
                    <span class="since-text"><b data-since-text>Counting all time</b><small>Change start date</small></span>
                </button>
                <button type="button" class="rail-link" data-act="signout"><span data-icon="logout"></span>Sign out</button>
            </div>
        </aside>

        <div class="stage">
            <header class="top">
                <div class="top-row">
                    <span class="logo logo-sm">P</span>
                    <div class="top-title">
                        <h1 id="page-title">Overview</h1>
                        <p id="page-sub"></p>
                    </div>
                    <div class="top-actions">
                        <button type="button" class="icon-btn only-small since-dot" data-act="since" aria-label="Choose the date to count from" data-icon="calendar"></button>
                        <button type="button" class="icon-btn" data-act="refresh" aria-label="Refresh data" title="Refresh data" data-icon="refresh"></button>
                        <button type="button" class="icon-btn only-small" data-act="signout" aria-label="Sign out" data-icon="logout"></button>
                    </div>
                </div>
                <div class="seg" id="period" role="group" aria-label="Time period">
                    <button type="button" data-period="7">7 days</button>
                    <button type="button" data-period="30">30 days</button>
                    <button type="button" data-period="90">90 days</button>
                    <button type="button" data-period="all">All</button>
                </div>
            </header>

            <div id="notice" class="notice" role="status" hidden></div>

            <main id="main">
                <section class="tab-panel" id="tab-overview"></section>
                <section class="tab-panel" id="tab-users" hidden></section>
                <section class="tab-panel" id="tab-rewards" hidden></section>
                <section class="tab-panel" id="tab-insights" hidden></section>
                <section class="tab-panel" id="tab-activity" hidden></section>
            </main>
        </div>

        <nav class="bottom-nav nav" id="bottom-nav" aria-label="Sections"></nav>
    </div>

    <div id="sheet" class="sheet" hidden>
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet-head">
                <button id="sheet-back" class="icon-btn" type="button" aria-label="Back" data-icon="back" hidden></button>
                <div class="sheet-titles">
                    <h2 id="sheet-title"></h2>
                    <p id="sheet-sub"></p>
                </div>
                <button class="icon-btn" type="button" data-close aria-label="Close" data-icon="close"></button>
            </div>
            <div id="sheet-body" class="sheet-body"></div>
        </div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - PikaShot</title>
    <link rel="stylesheet" href="admin.css">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, getDocs, query, where, Timestamp } from "https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBKu623PDECcc1gYVe4xof6AVUxDlW7B_A",
            authDomain: "pika-shot.firebaseapp.com",
            projectId: "pika-shot",
            storageBucket: "pika-shot.firebasestorage.app",
            messagingSenderId: "221719282655",
            appId: "1:221719282655:web:fefc576166eeb115077a6a"
        };

        // A named app keeps the admin sign-in separate from the anonymous session the main app
        // creates for every visitor on this same site; otherwise that session skips the login.
        const app = initializeApp(firebaseConfig, 'admin');
        window.fb = {
            auth: getAuth(app),
            db: getFirestore(app),
            onAuthStateChanged,
            signInWithEmailAndPassword,
            signOut,
            collection,
            doc,
            getDoc,
            setDoc,
            getDocs,
            query,
            where,
            Timestamp
        };
    </script>
</head>
<body>

    <div id="login-modal" class="modal-overlay">
        <form id="login-form" class="modal-content">
            <h2>Admin Login</h2>
            <input type="email" id="email-input" placeholder="Email" autocomplete="username" required>
            <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required>
            <button type="submit">Login</button>
            <p id="error-message" class="error"></p>
        </form>
    </div>

    <div id="dashboard-container" class="app" style="display: none;">
        <header class="topbar">
            <div class="topbar-row">
                <div class="brand">
                    <span class="logo">P</span>
                    <span class="brand-name">PikaShot <em>Admin</em></span>
                </div>
                <div class="top-actions">
                    <button id="since-btn" class="pill-btn" type="button" title="Choose the date to count from"></button>
                    <button id="refresh-btn" class="icon-btn" type="button" title="Refresh data" aria-label="Refresh data">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                    </button>
                    <button id="signout-btn" class="pill-btn quiet" type="button">Sign out</button>
                </div>
            </div>
            <div class="controls">
                <nav class="tabs" id="tabs" aria-label="Dashboard sections">
                    <button type="button" data-tab="overview">Overview</button>
                    <button type="button" data-tab="users">Users</button>
                    <button type="button" data-tab="rewards">Rewards</button>
                    <button type="button" data-tab="insights">Insights</button>
                    <button type="button" data-tab="activity">Activity</button>
                </nav>
                <div class="seg" id="period" role="group" aria-label="Time period">
                    <button type="button" data-period="7">7D</button>
                    <button type="button" data-period="30">30D</button>
                    <button type="button" data-period="90">90D</button>
                    <button type="button" data-period="all">All</button>
                </div>
            </div>
        </header>

        <div id="notice" class="notice" hidden></div>

        <main id="main">
            <section class="tab-panel" id="tab-overview"></section>
            <section class="tab-panel" id="tab-users" hidden></section>
            <section class="tab-panel" id="tab-rewards" hidden></section>
            <section class="tab-panel" id="tab-insights" hidden></section>
            <section class="tab-panel" id="tab-activity" hidden></section>
        </main>
    </div>

    <div id="sheet" class="sheet" hidden>
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
            <div class="sheet-head">
                <button id="sheet-back" class="icon-btn" type="button" aria-label="Back" hidden>&larr;</button>
                <div class="sheet-titles">
                    <h2 id="sheet-title"></h2>
                    <p id="sheet-sub"></p>
                </div>
                <button class="icon-btn" type="button" data-close aria-label="Close">&times;</button>
            </div>
            <div id="sheet-body" class="sheet-body"></div>
        </div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script src="admin.js"></script>
</body>
</html>
